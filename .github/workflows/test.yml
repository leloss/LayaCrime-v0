name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install --editable ".[academic,dev,train]"
      - name: Run tests
        run: pytest -q
      - name: Run lint
        run: ruff check src scripts tests
      - name: Check release contents
        run: python scripts/check_release_contents.py
      - name: Audit dependencies
        run: pip-audit --local
