[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-adverse-media"
version = "0.1.0"
description = "CrimeLaya benchmark and fine-tuning tools for criminality sentiment analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastapi>=0.110,<1",
    "laya @ git+https://github.com/NandhaKishorM/laya.git@v0.3.10",
    "openai>=2,<3",
    "pip-system-certs>=5,<6; sys_platform == 'win32'",
    "pydantic>=2.6,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
train = [
    "numpy>=1.26,<3",
    "safetensors>=0.4,<1",
    "torch>=2.4",
    "transformers>=4.48,<5",
]

[project.scripts]
laya-adverse-media = "laya_adverse_media.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_adverse_media"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
