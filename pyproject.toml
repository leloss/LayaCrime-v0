[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "laya-adverse-media"
version = "0.1.0"
description = "LayaCrime benchmark and fine-tuning tools for criminal intent analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<3.14"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "fastapi>=0.110,<1",
    "laya @ git+https://github.com/NandhaKishorM/laya.git@v0.3.10",
    "openai>=2,<3",
    "pip-system-certs>=5,<6; sys_platform == 'win32'",
    "pydantic>=2.6,<3",
    "python-dotenv>=1,<2",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pip-audit>=2.10,<3",
    "pytest>=9.0.3,<10",
    "ruff>=0.16,<1",
]
train = [
    "huggingface-hub>=1.31,<3",
    "numpy>=1.26,<3",
    "safetensors>=0.8,<1",
    "torch>=2.4",
    "transformers>=5.18,<6",
]
academic = [
    "numpy>=1.26,<3",
    "scikit-learn>=1.4,<2",
    "spacy>=3.7,<4",
    "torch>=2.4",
]

[project.scripts]
laya-adverse-media = "laya_adverse_media.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/laya_adverse_media"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
